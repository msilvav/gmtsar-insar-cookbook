<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="128%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ma" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#d97706"/></marker>
    <marker id="mb" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#2563eb"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Los dos mundos de coordenadas del InSAR</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">dónde entran topo_ra, las órbitas y el deramp</text>

  <!-- bands -->
  <rect x="24" y="74" width="952" height="140" rx="14" fill="#eff6ff"/>
  <text x="44" y="99" font-size="14" font-weight="700" fill="#1d4ed8">GEOGRÁFICO · lon, lat</text>
  <text x="44" y="116" font-size="11.5" fill="#3b82f6">productos y fusión con Sentinel-2</text>

  <rect x="24" y="326" width="952" height="168" rx="14" fill="#fff7ed"/>
  <text x="44" y="351" font-size="14" font-weight="700" fill="#ea580c">RADAR · range, azimut</text>
  <text x="44" y="368" font-size="11.5" fill="#f97316">el sistema natural del dato</text>

  <!-- geo boxes -->
  <g>
    <rect x="60" y="118" width="164" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="142" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">DEM</text>
    <text x="142" y="163" text-anchor="middle" font-size="11.5" fill="#64748b">elevación (dem.grd)</text>

    <rect x="784" y="114" width="180" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
    <text x="874" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">LOS geocodificado</text>
    <text x="874" y="158" text-anchor="middle" font-size="11.5" fill="#64748b">el PRODUCTO</text>
    <text x="874" y="173" text-anchor="middle" font-size="11" fill="#94a3b8">los_ll.grd → COG / Zarr</text>
  </g>

  <!-- topo_ra bridge -->
  <rect x="290" y="256" width="164" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
  <text x="372" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">topo_ra</text>
  <text x="372" y="297" text-anchor="middle" font-size="11.5" fill="#b45309">el DEM en geometría radar</text>

  <!-- radar boxes -->
  <g>
    <rect x="60" y="398" width="164" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="142" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">SLC × 2</text>
    <text x="142" y="442" text-anchor="middle" font-size="11.5" fill="#64748b">maestra + alineada</text>

    <rect x="290" y="398" width="164" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="372" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Interferograma</text>
    <text x="372" y="442" text-anchor="middle" font-size="11.5" fill="#64748b">fase envuelta</text>

    <rect x="520" y="398" width="196" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="618" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Desenrollado (SNAPHU)</text>
    <text x="618" y="442" text-anchor="middle" font-size="11.5" fill="#64748b">→ LOS en range/azimut</text>
  </g>

  <!-- arrows -->
  <!-- DEM -> topo_ra -->
  <path d="M142,180 L142,232 L372,232 L372,256" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ma)"/>
  <text x="152" y="212" font-size="12" font-weight="600" fill="#b45309">SAT_llt2rat · usa la órbita</text>

  <!-- topo_ra -> interferograma -->
  <path d="M372,312 L372,398" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#mg)"/>
  <text x="382" y="360" font-size="11.5" fill="#475569">resta la topografía</text>

  <!-- SLC -> interf -->
  <path d="M224,429 L290,429" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#mg)"/>
  <!-- interf -> desenrollado -->
  <path d="M454,429 L520,429" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#mg)"/>
  <text x="464" y="421" font-size="11" fill="#475569">SNAPHU</text>

  <!-- desenrollado -> LOS geocod -->
  <path d="M716,414 L750,414 L750,149 L784,149" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <text x="760" y="252" font-size="12" font-weight="600" fill="#1d4ed8">proj_ra2ll</text>
  <text x="760" y="268" font-size="11.5" fill="#3b82f6">(trans.dat)</text>

  <!-- deramp note -->
  <path d="M618,460 L618,474" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="618" y="487" text-anchor="middle" font-size="11.5" fill="#64748b">luego, el deramp quita la rampa orbital (ajuste de plano)</text>
</svg>

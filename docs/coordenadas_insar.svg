<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar--" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arX" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">InSAR: dos sistemas de coordenadas — dónde entran topo_ra, las órbitas y el deramp</text>

  <!-- LANE: geographic -->
  <rect x="20" y="52" width="940" height="150" rx="10" fill="#e8f0fe" stroke="#bfdbfe"/>
  <text x="34" y="74" font-size="14" font-weight="bold" fill="#1d4ed8">MUNDO GEOGRÁFICO — (lon, lat)</text>
  <text x="34" y="92" font-size="12" fill="#3b5bdb">donde se entregan los productos y se hace fusión con Sentinel-2</text>

  <!-- LANE: radar -->
  <rect x="20" y="318" width="940" height="182" rx="10" fill="#fff4e6" stroke="#fed7aa"/>
  <text x="34" y="340" font-size="14" font-weight="bold" fill="#c2410c">MUNDO RADAR — (range = distancia satélite→suelo, azimut = a lo largo de la órbita)</text>

  <!-- GEO boxes -->
  <g font-size="13" fill="#0f172a">
    <rect x="48" y="112" width="150" height="60" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="123" y="138" text-anchor="middle" font-weight="bold">DEM (dem.grd)</text>
    <text x="123" y="156" text-anchor="middle" font-size="11" fill="#475569">elevación del terreno</text>

    <rect x="760" y="108" width="182" height="68" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="851" y="132" text-anchor="middle" font-weight="bold">LOS geocodificado</text>
    <text x="851" y="150" text-anchor="middle" font-size="11" fill="#475569">los_ll.grd → COG / Zarr</text>
    <text x="851" y="165" text-anchor="middle" font-size="11" fill="#475569">(el PRODUCTO)</text>
  </g>

  <!-- RADAR boxes -->
  <g font-size="13" fill="#0f172a">
    <rect x="48" y="392" width="150" height="60" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="123" y="416" text-anchor="middle" font-weight="bold">SLC maestra</text>
    <text x="123" y="434" text-anchor="middle" font-weight="bold">+ SLC alineada</text>

    <rect x="262" y="392" width="158" height="60" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="341" y="416" text-anchor="middle" font-weight="bold">Interferograma</text>
    <text x="341" y="434" text-anchor="middle" font-size="11" fill="#475569">(fase envuelta)</text>

    <rect x="500" y="392" width="200" height="60" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="600" y="416" text-anchor="middle" font-weight="bold">Desenrollado (SNAPHU)</text>
    <text x="600" y="434" text-anchor="middle" font-size="11" fill="#475569">→ LOS en range/azimut</text>

    <!-- topo_ra: sits at the geo→radar boundary, emphasized -->
    <rect x="262" y="250" width="158" height="52" rx="8" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
    <text x="341" y="272" text-anchor="middle" font-weight="bold">topo_ra</text>
    <text x="341" y="289" text-anchor="middle" font-size="11" fill="#92400e">DEM en geometría radar</text>
  </g>

  <!-- ARROWS -->
  <!-- DEM -> topo_ra (geo to radar transform) -->
  <path d="M123,172 L123,226 L262,262" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arX)"/>
  <text x="128" y="200" font-size="12" font-weight="bold" fill="#b45309">① SAT_llt2rat</text>
  <text x="128" y="216" font-size="11" fill="#b45309">usa la ÓRBITA (POEORB)</text>

  <!-- topo_ra -> interferograma (subtract topo phase) -->
  <path d="M341,302 L341,392" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar--)"/>
  <text x="350" y="352" font-size="11" fill="#334155">② se RESTA la</text>
  <text x="350" y="366" font-size="11" fill="#334155">fase de la topografía</text>

  <!-- SLC -> interferograma -->
  <path d="M198,422 L262,422" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar--)"/>

  <!-- interferograma -> desenrollado -->
  <path d="M420,422 L500,422" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar--)"/>
  <text x="428" y="414" font-size="11" fill="#334155">SNAPHU</text>

  <!-- desenrollado -> LOS geocod (radar to geo transform) -->
  <path d="M700,410 L730,410 L730,142 L760,142" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arX)"/>
  <text x="612" y="360" font-size="12" font-weight="bold" fill="#1d4ed8">③ proj_ra2ll (trans.dat)</text>
  <text x="612" y="376" font-size="11" fill="#1d4ed8">de radar a lon/lat</text>

  <!-- deramp annotation on desenrollado -->
  <path d="M600,452 L600,468" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="600" y="480" text-anchor="middle" font-size="11" fill="#64748b">luego: deramp = quita la rampa orbital (ajuste de plano robusto)</text>
</svg>
